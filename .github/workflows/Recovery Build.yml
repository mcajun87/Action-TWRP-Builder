name: 构建Build-OrangeFox-d1x

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'OrangeFox 源码 Manifest 地址'
        required: true
        default: 'https://gitlab.com/OrangeFox/Manifest.git'
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest 分支'
        required: true
        default: 'fox_16.0'
      DEVICE_TREE_URL:
        description: 'd1x 设备树地址'
        required: true
        default: 'https://github.com/mcajun87/android_device_samsung_d1x'
      DEVICE_TREE_BRANCH:
        description: 'd1x 设备树分支'
        required: true
        default: 'fox_16.0'
      COMMON_TREE_URL:
        description: 'Exynos9820 通用设备树地址'
        required: true
        default: 'https://github.com/mcajun87/android_device_samsung_exynos9820-common'
      COMMON_TREE_BRANCH:
        description: '通用设备树分支'
        required: true
        default: 'fox_16.0'
      DEVICE_NAME:
        description: '设备代号'
        required: true
        default: 'd1x'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 6小时超时
    permissions:
      contents: write

    env:
      MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
      COMMON_TREE_BRANCH: ${{ github.event.inputs.COMMON_TREE_BRANCH }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Maximize Free Disk Space (极限清理磁盘)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo docker image prune --all --force || true
        df -h

    - name: Prepare build environment
      run: |
        sudo apt update
        sudo apt install -y git git-lfs curl ca-certificates python3 rsync build-essential bc bison flex libssl-dev libncurses5-dev zlib1g-dev python-is-python3 ccache
        git lfs install

    - name: Setup OpenJDK 17 (Android 16 必须)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set Swap Space (设置 16G 虚拟内存防爆内存)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Init and Sync Source
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        
        repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      id: pwd

    - name: Clone Device Tree and Common Tree
      run: |
        mkdir -p "device/samsung/d1x"
        git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" --depth=1 "device/samsung/d1x"
        
        mkdir -p "device/samsung/exynos9820-common"
        git clone "$COMMON_TREE_URL" -b "$COMMON_TREE_BRANCH" --depth=1 "device/samsung/exynos9820-common"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clean and Build Recovery
      run: |
        # 清理掉源码里其他自带设备的冲突
        find device/ -maxdepth 3 -mindepth 3 -not -path "device/samsung/d1x*" -not -path "device/samsung/exynos9820-common*" -exec rm -rf {} + || true
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1
        
        # 强制指定正确的 Lunch 目标为 twrp_d1x-eng
        LUNCH_TARGET="twrp_d1x-eng"
        echo "=== 最终确认的 Lunch 目标: $LUNCH_TARGET ==="
        lunch "$LUNCH_TARGET"
        
        # 开始编译
        mka recoveryimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Create Samsung Odin TAR
      run: |
        OUT_DIR="out/target/product/$DEVICE_NAME"
        if [ -f "$OUT_DIR/recovery.img" ]; then
          echo "编译成功，正在打包 Odin Tar..."
          cd "$OUT_DIR"
          # Odin 要求使用 ustar 格式
          tar -H ustar -cf recovery.tar recovery.img
          md5sum recovery.tar > recovery.tar.md5
        else
          echo "错误: 未找到 recovery.img，编译失败。"
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery.tar
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery.tar.md5
        name: OrangeFox-${{ env.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          ### Build Output
          * Device: Samsung Note10 5G (d1x)
          * Main Tree Branch: ${{ env.DEVICE_TREE_BRANCH }}
          * Common Tree Branch: ${{ env.COMMON_TREE_BRANCH }}
          * Manifest Branch: ${{ env.MANIFEST_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}